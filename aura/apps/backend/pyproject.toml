[project]
name = "aura-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "cryptography>=42",
  "playwright>=1.45",
  "typer>=0.12",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "openai>=1.0",
  "anthropic>=0.40",
  "pytest>=8.2"
]

[project.scripts]
aura = "aura.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
