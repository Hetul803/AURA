<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA Desktop</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #02060d; color: #dffdf7; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .boot-fallback { min-height: 100vh; display: grid; place-items: center; padding: 32px; box-sizing: border-box; background: radial-gradient(circle at 50% 20%, rgba(88, 255, 224, 0.16), transparent 34%), #02060d; }
      .boot-card { max-width: 680px; border: 1px solid rgba(111, 246, 215, 0.28); border-radius: 14px; padding: 28px; background: rgba(8, 21, 37, 0.86); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45); }
      .boot-card h1 { margin: 0 0 10px; font-size: 34px; }
      .boot-card p { margin: 0; color: #9bb6c8; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-fallback"><section class="boot-card"><h1>AURA is starting.</h1><p>If this message stays here, the packaged renderer did not load. Rebuild with <code>pnpm aura:package</code> and check Advanced / Diagnostics or the Electron logs.</p></section></div></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
