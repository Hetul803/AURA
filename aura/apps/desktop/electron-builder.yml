appId: com.aegisure.desktop
productName: Aegisure
artifactName: Aegisure-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
extraResources:
  - from: build-resources/backend
    to: backend
  - from: build-resources/native
    to: native
extraMetadata:
  description: Private, local-first personal AI operating layer.
asar: true
win:
  target:
    - nsis
mac:
  target:
    - dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Aegisure uses the microphone only when you press push-to-talk.
    NSSpeechRecognitionUsageDescription: Aegisure uses speech recognition only when you press push-to-talk.
linux:
  target:
    - AppImage
